# 默认是示例航线，不代表你的实际出行计划；修改本文件即可调整。
# 网页可自由选择城市/日期；本文件供命令行使用。
# 多平台使用城市代码：SHA 上海、BJS 北京、CAN 广州、TYO 东京、SIN 新加坡。
# sources 可选 ctrip / tongcheng / qunar / fliggy / google_flights / kiwi / ryanair。
# 不填时查询全部；其中 Kiwi 和瑞安仅展示参考价，不参与总价提醒。
[monitor]
timezone = "Asia/Shanghai"
interval_minutes = 360          # 每 6 小时查询；最低 10 分钟
digest_hours = 24               # lowest / both 每 24 小时汇总最低参考价
repeat_hours = 24               # 低于阈值但未继续降价，24 小时后再提醒
min_drop = 1                   # 距上次阈值提醒再降至少 1 元，提前再次提醒
timeout_seconds = 30
request_delay_seconds = 1.0
max_requests_per_cycle = 60     # 每个数据源每轮请求上限
database = "data/prices.sqlite3"

[[routes]]
id = "shanghai-beijing"
name = "国内 · 上海 → 北京"
provider = "multi"
market = "domestic"
origin = "SHA"
destination = "BJS"
currency = "CNY"
mode = "both"                  # lowest 最低价汇总 / threshold 仅低于阈值 / both 两者
threshold = 600                 # 严格小于 600 元才触发阈值提醒
start_offset_days = 7           # 从今天起第 7 天
end_offset_days = 21            # 到今天起第 21 天，包含两端

[[routes]]
id = "shanghai-guangzhou"
name = "国内 · 上海 → 广州"
provider = "multi"
market = "domestic"
origin = "SHA"
destination = "CAN"
currency = "CNY"
mode = "both"
threshold = 600
start_offset_days = 7
end_offset_days = 21

[[routes]]
id = "shanghai-tokyo"
name = "国际 · 上海 → 东京"
provider = "multi"
market = "international"
origin = "SHA"
destination = "TYO"
currency = "CNY"
mode = "both"
threshold = 1200
start_offset_days = 7
end_offset_days = 21

[[routes]]
id = "shanghai-singapore"
name = "国际 · 上海 → 新加坡"
provider = "multi"
market = "international"
origin = "SHA"
destination = "SIN"
currency = "CNY"
mode = "both"
threshold = 1200
start_offset_days = 7
end_offset_days = 21
